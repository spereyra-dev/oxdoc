name: Python package

on:
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-package.yml"
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/python-package.yml"

permissions:
  contents: read

jobs:
  test-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Run wrapper tests
        run: PYTHONPATH=python/src python -m unittest discover -s python/tests
      - name: Build distributions
        run: python -m build python
      - name: Validate distribution metadata
        run: python -m twine check python/dist/*
      - name: Smoke-test installed wheel
        run: |
          python -m venv .venv-package-smoke
          .venv-package-smoke/bin/python -m pip install --no-index --find-links python/dist oxdoc-python
          .venv-package-smoke/bin/python -c "from importlib.metadata import version; from oxdoc import Oxdoc; assert version('oxdoc-python') == '0.1.0'; assert Oxdoc.__name__ == 'Oxdoc'"
